# Non-secret Hermes settings, merged into /data/.hermes/config.yaml on every boot.
# Git is the source of truth: edits made in the dashboard for these keys are overwritten.
# API keys do NOT belong here. Set them in Railway variables or the dashboard (Keys > Providers).

# Haiku runs the main loop: every message, tool call and routine reasoning step.
model:
  provider: anthropic
  default: claude-haiku-5-5

# Sonnet runs delegated subagents. Hermes decides on its own to delegate tasks that
# need heavier reasoning, judgment or long-form writing (delegate_task).
delegation:
  provider: anthropic
  model: claude-sonnet-5-5

# Failover chain, tried in order when the primary fails (rate limit, overload, connection or
# auth errors). Entries need both provider and model. Same Anthropic key, so it works now.
fallback_providers:
  - provider: anthropic
    model: claude-sonnet-5-5
  # Cross-provider step: enable once that provider's key is set and the model ID is checked.
  # - provider: openrouter
  #   model: <model id from openrouter.ai/models>
