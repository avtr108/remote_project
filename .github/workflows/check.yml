name: check

on:
  pull_request:
  push:
    branches: [setup/hermes-routing]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install PyYAML
        run: pip install pyyaml==6.0.2
      - name: Overlay, merge script, skills, Railway and Dockerfile checks
        run: python3 scripts/check.py
      - name: Shellcheck entrypoint
        run: shellcheck docker-entrypoint.sh
